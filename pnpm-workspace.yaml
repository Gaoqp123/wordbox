allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
# pnpm 11 起，配置从 package.json 的 "pnpm" 字段搬到了这里。
# 默认情况下依赖的安装脚本被全部拦下（安全策略），下面这些必须放行，否则装不完整：
#   electron            —— 下载 Electron 二进制，不放行则 node_modules/electron/dist 为空
#   esbuild             —— Vite 的转译器，需要落地平台二进制
#   electron-winstaller —— 打包 Windows 安装包时用到
onlyBuiltDependencies:
  - electron
  - esbuild
  - electron-winstaller
